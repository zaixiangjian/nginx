server {
    listen 80;
    listen [::]:80;
    server_name yuming.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name yuming.com;




    # 获取经过 Cloudflare 代理访问的访客真实 IP
    # 信任 Cloudflare 的 IPv4 地址段
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;

    # 信任 Cloudflare 的 IPv6 地址段
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # 从 Cloudflare 提供的 CF-Connecting-IP 请求头读取访客 IP，
    # 让 $remote_addr 和默认访问日志使用访客 IP，而不是 Cloudflare 节点 IP。
    real_ip_header CF-Connecting-IP;

    # 请求头包含多个地址时，跳过已信任的代理，查找客户端 IP。
    # CF-Connecting-IP 通常只有一个地址，此项保留开启即可。
    real_ip_recursive on;

    # 使用 Cloudflare 时，无需启用下面这行。
    # 仅在改用其他代理、确认其通过 X-Forwarded-For 传递访客 IP，
    # 并已配置该代理的可信网段后，才用下面这行替换上面的
    # real_ip_header CF-Connecting-IP;，不要同时启用两行。
    # real_ip_header X-Forwarded-For;




    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 223.5.5.5 valid=300s;
    resolver_timeout 5s; 

    ssl_certificate /etc/nginx/certs/yuming.com_cert.pem;
    ssl_certificate_key /etc/nginx/certs/yuming.com_key.pem;




    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    # 以下仅控制 TLS 1.2；TLS 1.3 使用默认密码套件
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';

    # 要求浏览器在有效期内使用 HTTPS
    add_header Strict-Transport-Security "max-age=31536000" always;
    # 禁止浏览器猜测文件类型
    add_header X-Content-Type-Options "nosniff" always;
    # 仅允许同源页面通过 iframe 嵌入
    add_header X-Frame-Options "SAMEORIGIN" always;
    # 关闭旧式浏览器 XSS 过滤器
    add_header X-XSS-Protection "0" always;
    # 不向跳转目标发送来源信息
    add_header Referrer-Policy "no-referrer" always;
    # 隐藏 Nginx 版本号及 PHP 的 X-Powered-By 响应头
    server_tokens off;
    fastcgi_hide_header X-Powered-By;




    root /var/www/html/yuming.com/wordpress;
    index index.php;




    location / {
        try_files $uri $uri/ /index.php?$args;
    }
    # 禁止访问隐藏文件、目录，例如 .env、.git
    # 保留 .well-known，避免影响证书验证
    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
    }
    # 禁止访问 WordPress 配置文件及常见备份副本
    location ~* ^/wp-config\.php(?:$|[.~]) {
        deny all;
    }
    # 禁止访问安装说明、示例配置
    location ~* ^/(?:wp-config-sample\.php|readme\.html|license\.txt)$ {
        deny all;
    }
    # 上传目录不允许执行 PHP
    # 必须放在下面的通用 PHP 规则前面
    location ~* ^/wp-content/uploads/.*\.php(?:/|$) {
        deny all;
    }




    # PHP 请求：仅将实际存在的文件交给 PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        fastcgi_pass php:9000;
        fastcgi_index index.php;

        # 不在这里直接启用全站 PHP 缓存，
        # 避免缓存登录状态、购物车、订单等动态内容。
    }




    # 静态资源缓存
    # 使用 expires，避免单独设置 add_header 破坏父级安全头继承
    location ~* \.(?:js|css|png|jpe?g|gif|ico|bmp|webp|avif|svg|eot|ttf|woff2?)$ {
        expires 30d;
        log_not_found off;
    }




    # Nginx 允许的请求体大小
    # PHP 上传限制还需同时调整 upload_max_filesize 和 post_max_size
    client_max_body_size 50m;

    # 不额外限制缓冲区，使用 Nginx 默认值。
    # 缓冲区大小不是通用的“防溢出”安全设置。

    # 不在站点层统一禁止 OPTIONS、PUT、PATCH、DELETE，
    # 避免影响 WordPress REST API、跨域请求或插件。
    # 接口操作权限由 WordPress 和插件进行认证、授权。
}
