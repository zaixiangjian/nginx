server {
    listen 80;
    listen [::]:80;
    server_name yuming.com;
    return 301 https://$host$request_uri;
  }

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name yuming.com;

  # 获取经过 Cloudflare 代理访问的访客真实 IP
  # 信任 Cloudflare 的 IPv4 地址段
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;

  # 信任 Cloudflare 的 IPv6 地址段
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;

  # 从 Cloudflare 提供的 CF-Connecting-IP 请求头读取访客 IP，
  # 让 $remote_addr 和默认访问日志使用访客 IP，而不是 Cloudflare 节点 IP。
  real_ip_header CF-Connecting-IP;

  # 请求头包含多个地址时，跳过已信任的代理，查找客户端 IP。
  # CF-Connecting-IP 通常只有一个地址，此项保留开启即可。
  real_ip_recursive on;

  # 使用 Cloudflare 时，无需启用下面这行。
  # 仅在改用其他代理、确认其通过 X-Forwarded-For 传递访客 IP，
  # 并已配置该代理的可信网段后，才用下面这行替换上面的
  # real_ip_header CF-Connecting-IP;，不要同时启用两行。
  # real_ip_header X-Forwarded-For;

  ssl_stapling on;
  ssl_stapling_verify on;
  resolver 1.1.1.1 8.8.8.8 223.5.5.5 valid=300s;
  resolver_timeout 5s; 

  ssl_certificate /etc/nginx/certs/yuming.com_cert.pem;
  ssl_certificate_key /etc/nginx/certs/yuming.com_key.pem;

  location / {

      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   Host $host;
      proxy_pass         http://0.0.0.0:0000/;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";

      # proxy_cache my_proxy_cache;

  }

client_max_body_size 1000m;
}


